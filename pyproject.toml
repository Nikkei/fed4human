[project]
name = "fed4human"
version = "1.0.0"
description = "Python Virtual Environment of Factual Error Detection for Human"
authors = [
    { name = "Kazuma Iwamoto" },
    { name = "Kazumasa Omura" },
    { name = "Shotaro Ishihara" },
]
requires-python = "~=3.10.0"
readme = "README.md"
license = { file = "LICENSE" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/fed4human"]

[tool.hatch.build.targets.wheel]
packages = ["src/fed4human"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "I",  # isort
]
ignore = [
    "E203",  # whitespace before ":"
    "E501",  # line-too-long
    # Ruff doesn't enable pycodestyle warnings (W)
    # "W503",  # line break occurred before a binary operator
]

[tool.ruff.lint.isort]
known-first-party = ["fed4human"]
